name: sikka
description: UPI-based loyalty points app for Indian kirana stores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  provider: ^6.1.2
  # mobile_scanner: ^6.0.2  # Enable when integrating real camera
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
